<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>
  <script>
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <style>
    :root {
      --bg: #f9f9f9;
      --card-bg: #ffffff;
      --card-border: 1px solid rgba(0,0,0,0.08);
      --text-primary: #111;
      --text-secondary: #666;
      --accent: #2563eb;
      --pill-active-bg: #111;
      --pill-active-text: #fff;
      --toggle-bg: rgba(0,0,0,0.06);
      --toggle-color: #555;
    }

    html.dark {
      --bg: #111;
      --card-bg: #1a1a1a;
      --card-border: 1px solid rgba(255,255,255,0.08);
      --text-primary: #f0f0f0;
      --text-secondary: #888;
      --pill-active-bg: #f0f0f0;
      --pill-active-text: #111;
      --toggle-bg: rgba(255,255,255,0.08);
      --toggle-color: #aaa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 16px 14px;
      }
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .page-subtitle {
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: 4px;
    }

    .theme-toggle {
      background: var(--toggle-bg);
      border: none;
      cursor: pointer;
      color: var(--toggle-color);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 17px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
      transition: color 0.1s;
    }

    .theme-toggle:hover {
      color: var(--text-primary);
    }

    /* Filter bar */
    .filters {
      margin-bottom: 20px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .filter-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 20px;
      transition: color 0.1s, background 0.1s;
      line-height: 1.5;
    }

    .filter-btn:hover {
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
    }

    /* Project list */
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .project-card {
      background: var(--card-bg);
      border: var(--card-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
      gap: 12px;
    }

    .card-header:hover {
      background: rgba(0,0,0,0.02);
    }

    html.dark .card-header:hover {
      background: rgba(255,255,255,0.03);
    }

    .card-title {
      font-weight: 500;
      color: var(--text-primary);
      flex: 1;
      min-width: 0;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Chevron */
    .chevron {
      width: 16px;
      height: 16px;
      color: var(--text-secondary);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .card-header.open .chevron {
      transform: rotate(90deg);
    }

    /* Expanded panel */
    .card-body {
      display: none;
      padding: 0 14px 14px 14px;
      border-top: var(--card-border);
    }

    .card-body.open {
      display: block;
    }

    .body-row {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .body-label {
      font-weight: 500;
      color: var(--text-secondary);
      margin-right: 4px;
    }

    .body-text {
      color: var(--text-primary);
    }

    /* Sub-tasks */
    .subs-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .sub-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-primary);
    }

    .sub-item input[type="checkbox"] {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      cursor: default;
      pointer-events: none;
    }

    .sub-done {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .body-updated {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      text-align: right;
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <div class="page-title">Projects</div>
        <div class="page-subtitle" id="last-updated"></div>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"></button>
    </div>

    <div class="filters">
      <div class="filter-row" id="status-filters"></div>
    </div>

    <div class="project-list" id="project-list"></div>
  </div>

  <script>
    const STATUS_FILTERS = ['All', 'Active', 'Monitoring', 'Queued'];


    let allProjects = [];
    let activeStatus = 'Active';
    let expandedIds  = new Set();

    // ── Theme ──────────────────────────────────────────────
    let manualTheme = null;

    function isDark() {
      return manualTheme !== null
        ? manualTheme === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function applyTheme() {
      document.documentElement.classList.toggle('dark', isDark());
      document.getElementById('theme-toggle').textContent = isDark() ? '☀' : '☽';
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (manualTheme === null) applyTheme();
    });

    document.getElementById('theme-toggle').addEventListener('click', () => {
      manualTheme = isDark() ? 'light' : 'dark';
      applyTheme();
    });

    applyTheme();

    // ── Helpers ────────────────────────────────────────────
    function fmtDate(iso) {
      const [y, m, d] = iso.split('-');
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[parseInt(m,10)-1]} ${parseInt(d,10)}, ${y}`;
    }

    function isActive(p) {
      return p.status === 'active' || p.status === 'watching';
    }

    const today = new Date();
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('last-updated').textContent =
      `Updated ${MONTHS[today.getMonth()]} ${today.getDate()}, ${today.getFullYear()}`;

    // ── Counts ─────────────────────────────────────────────
    function getCounts() {
      let active = 0, monitoring = 0, queued = 0;
      allProjects.forEach(p => {
        if (isActive(p))             active++;
        else if (p.status === 'monitoring') monitoring++;
        else if (p.status === 'queued')     queued++;
      });
      return { All: allProjects.length, Active: active, Monitoring: monitoring, Queued: queued };
    }

    // ── Filter pills ───────────────────────────────────────
    function renderFilters() {
      const counts = getCounts();
      document.getElementById('status-filters').innerHTML = STATUS_FILTERS.map(f =>
        `<button class="filter-btn${activeStatus === f ? ' active' : ''}" data-type="status" data-val="${f}">${f} (${counts[f]})</button>`
      ).join('');
    }

    // ── Sort & filter ──────────────────────────────────────
    function sortProjects(list) {
      return [...list].sort((a, b) => {
        if (a.time_sensitive !== b.time_sensitive) return a.time_sensitive ? -1 : 1;
        return a.title.localeCompare(b.title);
      });
    }

    function filteredProjects() {
      return sortProjects(allProjects.filter(p => {
        if (activeStatus === 'All')        return true;
        if (activeStatus === 'Active')     return isActive(p);
        return p.status === activeStatus.toLowerCase();
      }));
    }

    // ── Card HTML ──────────────────────────────────────────
    const CHEVRON_SVG = `<svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 4 10 8 6 12"/></svg>`;

    function cardHTML(p) {
      const isOpen   = expandedIds.has(p.id);

      const subsHTML = p.subs && p.subs.length
        ? `<div class="subs-list">${p.subs.map(s =>
            `<label class="sub-item">
              <input type="checkbox" ${s.done ? 'checked' : ''} />
              <span class="${s.done ? 'sub-done' : ''}">${s.label}</span>
            </label>`
          ).join('')}</div>`
        : '';

      const contextHTML = p.due_context
        ? `<div class="body-row"><span class="body-label">Context:</span><span class="body-text">${p.due_context}</span></div>`
        : '';

      return `
        <div class="project-card" data-id="${p.id}">
          <div class="card-header${isOpen ? ' open' : ''}" data-id="${p.id}">
            <span class="card-title">${p.title}</span>
            <div class="card-right">
              ${CHEVRON_SVG}
            </div>
          </div>
          <div class="card-body${isOpen ? ' open' : ''}">
            <div class="body-row">
              <span class="body-label">Next action:</span>
              <span class="body-text">${p.next_action}</span>
            </div>
            ${contextHTML}
            ${subsHTML}
            <div class="body-updated">Updated: ${fmtDate(p.last_updated)}</div>
          </div>
        </div>`;
    }

    // ── Render ─────────────────────────────────────────────
    function renderList() {
      const list = filteredProjects();
      const el = document.getElementById('project-list');
      el.innerHTML = list.length
        ? list.map(cardHTML).join('')
        : '<div class="empty-state">No projects match the current filters.</div>';
    }

    function render() {
      renderFilters();
      renderList();
    }

    // ── Events ─────────────────────────────────────────────
    document.addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (btn) {
        activeStatus = btn.dataset.val;
        render();
        return;
      }

      const header = e.target.closest('.card-header');
      if (header) {
        const id = header.dataset.id;
        if (expandedIds.has(id)) expandedIds.delete(id);
        else expandedIds.add(id);
        render();
      }
    });

    // ── Boot ───────────────────────────────────────────────
    fetch('./projects.json')
      .then(r => r.json())
      .then(data => {
        allProjects = data.projects;
        render();
      })
      .catch(() => {
        document.getElementById('project-list').innerHTML =
          '<div class="empty-state">Failed to load projects.json.</div>';
      });
  </script>
</body>
</html>
